name: Reproducibility issue
description: Report a concrete problem with a deterministic check or its documentation.
title: "[Reproducibility] "
body:
  - type: markdown
    attributes:
      value: |
        Include the evidence needed to reproduce the problem. Do not attach credentials, unpublished manuscripts, or private correspondence.
  - type: input
    id: commit
    attributes:
      label: Repository commit
      description: Output of git rev-parse HEAD, or the download URL and date.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and full output of python --version.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and working directory
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
      description: Identify the failing check and whether the files came from a fresh download.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Receipt and relevant log
      description: Include EXECUTION_RECORD.json and the failing log when available.
      render: text
